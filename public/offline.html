<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#059669" />
    <title>Sem conexão · Nutra</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(#ecfdf5, #f8fafc);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #0f172a;
      }
      main {
        max-width: 22rem;
        margin: 1.5rem;
        padding: 2rem 1.5rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
      }
      img {
        width: 56px;
        height: 56px;
      }
      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: #475569;
        line-height: 1.5;
      }
      button {
        width: 100%;
        padding: 0.75rem;
        border: 0;
        border-radius: 0.5rem;
        background: #059669;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Sem conexão com a internet</h1>
      <p>O Nutra precisa de internet para mostrar seus dados. Confira o Wi-Fi ou os dados móveis e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar de novo</button>
    </main>
  </body>
</html>
